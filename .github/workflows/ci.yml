name: corpus-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test standard library prototype
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run fictional work-timeline CLI
        run: PYTHONPATH=src python -m eaihome work-demo --known-at 2026-11-20T13:00:00+01:00 --effective-at 2026-11-20T11:00:00+01:00
      - name: Store and reload a fictional correction
        run: |
          PYTHONPATH=src python -m eaihome --home "$RUNNER_TEMP/eaihome-work-demo" work-correct --subject task_demo_a --event task.dismissed --actor test-operator --reason "Deze vraag was geen opdracht" --expected-revision 1 --request-id ci-correct-0001
          PYTHONPATH=src python -m eaihome --home "$RUNNER_TEMP/eaihome-work-demo" index
          PYTHONPATH=src python -m eaihome --home "$RUNNER_TEMP/eaihome-work-demo" work-state --known-at 2099-01-01T00:00:00+00:00 | python -c 'import json,sys; x=json.load(sys.stdin); assert x["local_correction_count"]==1; assert any(y["id"]=="task_demo_a" and y["status"]=="dismissed" for y in x["other_objects"])'

      - name: Check live canvas CLI is available
        run: PYTHONPATH=src python -m eaihome work-canvas --help
