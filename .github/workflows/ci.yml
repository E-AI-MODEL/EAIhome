name: corpus-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test standard library prototype
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run fictional work-timeline CLI
        run: PYTHONPATH=src python -m eaihome work-demo --known-at 2026-11-20T13:00:00+01:00 --effective-at 2026-11-20T11:00:00+01:00
