[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaihome"
version = "0.1.0"
description = "A local-first source registry and version-aware search for EAIhome"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - no license granted"}

[project.scripts]
eaihome = "eaihome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
